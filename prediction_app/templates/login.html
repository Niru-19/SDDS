{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dermio - Portal Gateway</title>
    <link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.0/css/all.min.css" rel="stylesheet">
    <style>
        body { 
            background-color: #051225; 
            height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
        }
        .auth-container { 
            background: #ffffff; 
            border-radius: 16px; 
            box-shadow: 0 12px 30px rgba(0,0,0,0.4); 
            width: 100%; 
            max-width: 500px; 
            padding: 35px; 
        }
        .nav-pills .nav-link { 
            color: #6c757d; 
            border: 1px solid #dee2e6; 
            margin: 0 5px; 
            font-weight: 600; 
        }
        .nav-pills .nav-link.active { 
            background-color: #06A3DA; 
            border-color: #06A3DA; 
        }
    </style>
</head>
<body>

    <div class="auth-container">
        <div class="text-center mb-4">
            <h1 class="text-primary fw-bold mb-1"><i class="fa fa-microscope me-2"></i>Dermio</h1>
            <p class="text-muted small">Select your portal role below to sign in</p>
        </div>

        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-danger p-2 small text-center mb-3" role="alert">
                    <i class="fa fa-exclamation-circle me-1"></i> {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <ul class="nav nav-pills nav-justified mb-4" id="portalTabs" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="patient-tab" data-bs-toggle="tab" data-bs-target="#patientPortal" type="button" role="tab">
                    <i class="fa fa-user me-2"></i>Patient Login
                </button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="doctor-tab" data-bs-toggle="tab" data-bs-target="#doctorPortal" type="button" role="tab">
                    <i class="fa fa-user-md me-2"></i>Doctor Portal
                </button>
            </li>
        </ul>

        <div class="tab-content" id="portalTabsContent">
            
            <div class="tab-pane fade show active" id="patientPortal" role="tabpanel">
                <form method="POST">
                    {% csrf_token %}
                    <input type="hidden" name="user_type" value="patient">
                    
                    <div class="mb-3 text-start">
                        <label class="form-label text-secondary small fw-bold">Username</label>
                        <input type="text" name="name" class="form-control" placeholder="Enter your username" required>
                    </div>
                    
                    <div class="mb-4 text-start">
                        <label class="form-label text-secondary small fw-bold">Registered Phone Number</label>
                        <input type="tel" name="phone_number" class="form-control" placeholder="Enter phone number" required>
                    </div>
                    
                    <button type="submit" class="btn btn-primary w-100 py-2.5 fw-bold">Access Patient Dashboard</button>
                </form>
            </div>

            <div class="tab-pane fade" id="doctorPortal" role="tabpanel">
                <form method="POST">
                    {% csrf_token %}
                    <input type="hidden" name="user_type" value="doctor">
                    
                    <div class="mb-3 text-start">
                        <label class="form-label text-secondary small fw-bold">Doctor ID / Username</label>
                        <input type="text" name="doctor_id" class="form-control" placeholder="Enter Doctor ID or Username" required>
                    </div>
                    
                    <div class="mb-4 text-start">
                        <label class="form-label text-secondary small fw-bold">Password</label>
                        <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                    </div>
                    
                    <button type="submit" class="btn btn-primary w-100 py-2.5 fw-bold">Verify & Authenticate</button>
                </form>
            </div>

        </div>

        <div class="text-center mt-4 pt-2 border-top">
            <a href="{% url 'home' %}" class="text-decoration-none small text-muted"><i class="fa fa-arrow-left me-1"></i> Back to Homepage</a>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
