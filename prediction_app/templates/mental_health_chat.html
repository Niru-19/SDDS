{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dermio - MindCare Support</title>
    <link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #051225;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
        }
        .chat-container {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.4);
            width: 100%;
            max-width: 650px;
            display: flex;
            flex-direction: column;
            height: 80vh;
        }
        .chat-stream {
            flex-grow: 1;
            overflow-y: auto;
            background-color: #f8f9fa;
            padding: 20px;
        }
        .msg-bubble {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 14px;
            font-size: 0.95rem;
            line-height: 1.5;
            margin-bottom: 15px;
        }
        .msg-bot {
            background-color: #e9ecef;
            color: #212529;
            border-bottom-left-radius: 2px;
        }
        .msg-user {
            background-color: #06A3DA;
            color: #ffffff;
            border-bottom-right-radius: 2px;
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <div class="card-header bg-primary text-white p-3 d-flex align-items-center justify-content-between" style="border-top-left-radius: 16px; border-top-right-radius: 16px;">
            <div class="d-flex align-items-center">
                <i class="fas fa-heartbeat fa-lg me-2"></i>
                <div>
                    <h5 class="m-0 fw-bold">Dermio MindCare</h5>
                    <small style="opacity: 0.8;">Compassionate RAG AI Assistant</small>
                </div>
            </div>
            <a href="{% url 'home' %}" class="btn btn-sm btn-outline-light"><i class="fas fa-home"></i></a>
        </div>
        
        <div class="chat-stream" id="chatStream">
            <div class="d-flex justify-content-start">
                <div class="msg-bubble msg-bot shadow-sm">
                    Hello! I am your companion for mental wellness. Feel free to talk about stress, anxiety, or anything on your mind. How are you doing today?
                </div>
            </div>
        </div>
        
        <div class="p-3 bg-white border-top" style="border-bottom-left-radius: 16px; border-bottom-right-radius: 16px;">
            <div class="input-group">
                <input type="text" id="chatMessageInput" class="form-control py-2" placeholder="Share what's on your mind..." onkeypress="handleKeyPress(event)">
                <button class="btn btn-primary px-4" type="button" onclick="dispatchChatMessage()">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
        </div>
    </div>

    <script>
    function dispatchChatMessage() {
        const inputEl = document.getElementById("chatMessageInput");
        const streamEl = document.getElementById("chatStream");
        const text = inputEl.value.trim();
        
        if (!text) return;
        
        // Append User Text to Chat Window
        streamEl.innerHTML += `
            <div class="d-flex justify-content-end">
                <div class="msg-bubble msg-user shadow-sm">
                    ${text}
                </div>
            </div>
        `;
        inputEl.value = "";
        streamEl.scrollTop = streamEl.scrollHeight;
        
        // Send payload background POST to Django
        fetch('/api/mental-health-chat/', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: text })
        })
        .then(response => response.json())
        .then(data => {
            if (data.reply) {
                streamEl.innerHTML += `
                    <div class="d-flex justify-content-start">
                        <div class="msg-bubble msg-bot shadow-sm">
                            ${data.reply.replace(/\n/g, '<br>')}
                        </div>
                    </div>
                `;
            } else {
                streamEl.innerHTML += `
                    <div class="d-flex justify-content-start">
                        <div class="msg-bubble alert alert-danger p-2 small border">
                            ⚠️ ${data.error || "Connection timed out."}
                        </div>
                    </div>
                `;
            }
            streamEl.scrollTop = streamEl.scrollHeight;
        })
        .catch(err => {
            console.error(err);
            streamEl.innerHTML += `
                <div class="d-flex justify-content-start">
                    <div class="msg-bubble alert alert-danger p-2 small border">
                        ⚠️ Error reaching backend gateway.
                    </div>
                </div>
            `;
            streamEl.scrollTop = streamEl.scrollHeight;
        });
    }

    function handleKeyPress(e) {
        if (e.key === 'Enter') {
            dispatchChatMessage();
        }
    }
    </script>
</body>
</html>
